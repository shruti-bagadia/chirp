name: nightly
# Company priority recalculation + dormant-company re-checks. Runs at 02:00 IST daily
# (20:30 UTC the previous day). No Tectonic needed — this never compiles a PDF.
on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    # Turn on by setting the repo variable CHIRP_SCHEDULING=on (after secrets are added).
    if: vars.CHIRP_SCHEDULING == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHIRP_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      DASHBOARD_PASSWORD_HASH: ${{ secrets.DASHBOARD_PASSWORD_HASH }}
      CHIRP_API_TOKEN: ${{ secrets.CHIRP_API_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install .
      - run: chirp nightly
