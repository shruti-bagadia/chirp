[project]
name = "chirp"
version = "0.1.0"
description = "Chirp: a little sparrow that finds jobs and flies your applications out."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  "bcrypt>=4.1",
  "pyyaml>=6.0",
  "pypdf>=4.2",
]

[project.scripts]
chirp = "app.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]
# Only the laptop Applier needs these (Playwright + a local embedding model for
# answer matching) — the dashboard and GitHub Actions workers never install this
# group, per docs/03_architecture.md ("no embeddings on Render").
applier = ["playwright>=1.45", "sentence-transformers>=3.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "workers*", "applier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# B008: FastAPI's `Depends(...)` in argument defaults is the framework's own idiom,
# not the mutable-default bug this rule targets.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Minified JS/HTML template strings; wrapping them would be actively worse.
"scripts/build_preview.py" = ["E501"]
