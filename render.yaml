# Render Blueprint — https://render.com/docs/blueprint-spec
#
# One-time setup once you have a Render account and a Supabase project:
#   1. Push this repo to GitHub, connect it in Render as a Blueprint (New > Blueprint).
#   2. Render creates the service below and prompts you for every `sync: false` var —
#      paste in your Supabase connection string, Supabase keys, Gemini key, and a
#      GitHub fine-grained token (repo: Actions read/write) for "Find now"/"Fly now".
#   3. SESSION_SECRET and CHIRP_API_TOKEN are auto-generated by Render — copy
#      CHIRP_API_TOKEN into the laptop Applier's own .env so it can authenticate.
#   4. DASHBOARD_PASSWORD_HASH: run `make password` locally and paste the hash in.
#
# The Finder/nightly work runs on GitHub Actions (see .github/workflows/), not here —
# this is only the dashboard + machine API, per docs/03_architecture.md.

services:
  - type: web
    name: chirp-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CHIRP_ENV
        value: production
      - key: OWNER_FIRST_NAME
        value: Shruti
      - key: SESSION_SECRET
        generateValue: true
      - key: DASHBOARD_PASSWORD_HASH
        sync: false
      - key: CHIRP_API_TOKEN
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: chirp-files
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_DAILY_REQUEST_BUDGET
        value: "900"
      - key: LLM_REQUESTS_PER_MINUTE
        value: "10"
      - key: GITHUB_DISPATCH_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: APPLY_DRY_RUN
        value: "true"
